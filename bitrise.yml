format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  primary:
    description: Build Orbit Shell debug APK for personal use
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradle_path: ./gradlew
        - android_home: $ANDROID_HOME
    - android-build@1:
        inputs:
        - project_location: .
        - module: app
        - variant: Debug
        - build_type: apk
    - deploy-to-bitrise-io@2: {}
